services:
  - type: web
    name: surveylabs-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12
      - key: FRONTEND_URL
        sync: false   # Set this manually in Render dashboard to your Vercel URL
      - key: DB_PATH
        value: /opt/render/project/data/surveylabs.db
    disk:
      name: surveylabs-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    healthCheckPath: /api/health
